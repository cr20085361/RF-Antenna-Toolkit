<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 混频器 (Mixer) - 圆形加内部叉号 -->
  <circle cx="50" cy="50" r="25" fill="none" stroke="#805AD5" stroke-width="4"/>
  <!-- X 标志 -->
  <line x1="35" y1="35" x2="65" y2="65" stroke="#805AD5" stroke-width="4" stroke-linecap="round"/>
  <line x1="35" y1="65" x2="65" y2="35" stroke="#805AD5" stroke-width="4" stroke-linecap="round"/>
  <!-- RF, LO, IF 端子 -->
  <line x1="10" y1="50" x2="25" y2="50" stroke="#805AD5" stroke-width="4" stroke-linecap="round"/>
  <line x1="75" y1="50" x2="90" y2="50" stroke="#805AD5" stroke-width="4" stroke-linecap="round"/>
  <!-- 下方 LO 输入 -->
  <line x1="50" y1="90" x2="50" y2="75" stroke="#805AD5" stroke-width="4" stroke-linecap="round"/>
</svg>
