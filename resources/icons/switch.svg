  <line x1="10" y1="50" x2="35" y2="50" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
  <!-- 开关臂 -->
  <line x1="35" y1="50" x2="65" y2="30" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
  <!-- 输出连接触点 -->
  <circle cx="65" cy="50" r="3" fill="none" stroke="#4A5568" stroke-width="3"/>
  <circle cx="65" cy="30" r="3" fill="none" stroke="#4A5568" stroke-width="3"/>
  <line x1="68" y1="50" x2="90" y2="50" stroke="#4A5568" stroke-width="4" stroke-linecap="round"/>
</svg>
